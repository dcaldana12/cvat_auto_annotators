name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate manifests and documentation
        run: python scripts/validate_repo.py

      - name: Check shell syntax
        run: bash -n llm/vlm_detector/deploy.sh

      - name: Compile Python handlers
        run: python -m compileall -q ultralytics llm
