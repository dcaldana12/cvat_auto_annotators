name: Feature request
description: Suggest a new detector, provider, deployment option, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before proposing an implementation. For large changes, opening an issue first helps avoid duplicated work.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, function, provider, or documentation you would like to add.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you considered.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New detector or model family
        - New VLM/OpenAI-compatible provider
        - Deployment or configuration
        - Documentation
        - Tests or validation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: I understand that new functions must be deployable with CVAT and Nuclio.
          required: true
