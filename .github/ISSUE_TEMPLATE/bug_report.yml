name: Bug report
description: Report a reproducible problem with a function or deployment step.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please search existing issues first and remove all secrets from logs and configuration before submitting.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project is affected?
      options:
        - YOLO OBB
        - YOLO Detect
        - VLM Detector
        - Nuclio deployment
        - Docker Compose override
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the commands you ran and the CVAT UI actions.
      placeholder: |
        1. Start CVAT with ...
        2. Deploy ...
        3. Run automatic annotation ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Function logs, `nuctl` output, or browser errors. Redact API keys and private data.
      render: shell
    validations:
      required: false

  - type: input
    id: cvat-version
    attributes:
      label: CVAT version
      placeholder: "2.81.0"
    validations:
      required: true

  - type: input
    id: nuctl-version
    attributes:
      label: nuctl / Nuclio version
      placeholder: "1.16.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Host OS and Docker version
      placeholder: "Ubuntu 24.04, Docker 28.x"
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Relevant non-secret settings, for example `LLM_BASE_URL` or model names.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed API keys, tokens, private images, and personal data from this report.
          required: true
        - label: I can reproduce this with the latest revision of the default branch.
          required: true
