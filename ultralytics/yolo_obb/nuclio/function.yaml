metadata:
  name: yolo_obb
  namespace: cvat
  annotations:
    name: YOLO OBB
    type: detector
    framework: pytorch
    # Specify the list of classes that the model can detect
    # The list of classes should be in the same order as the model output
    spec: |
      [
        { "id": 0, "name": "plane", "type": "rectangle" },
        { "id": 1, "name": "ship", "type": "rectangle" },
        { "id": 2, "name": "storage tank", "type": "rectangle" },
        { "id": 3, "name": "baseball diamond", "type": "rectangle" },
        { "id": 4, "name": "tennis court", "type": "rectangle" },
        { "id": 5, "name": "basketball court", "type": "rectangle" },
        { "id": 6, "name": "ground track field", "type": "rectangle" },
        { "id": 7, "name": "harbor", "type": "rectangle" },
        { "id": 8, "name": "bridge", "type": "rectangle" },
        { "id": 9, "name": "large vehicle", "type": "rectangle" },
        { "id": 10, "name": "small vehicle", "type": "rectangle" },
        { "id": 11, "name": "helicopter", "type": "rectangle" },
        { "id": 12, "name": "roundabout", "type": "rectangle" },
        { "id": 13, "name": "soccer ball field", "type": "rectangle" },
        { "id": 14, "name": "swimming pool", "type": "rectangle" }
      ]
spec:
  description: YOLO OBB via pytorch
  runtime: 'python:3.12'
  handler: main:handler
  eventTimeout: 30s
  build:
    image: cvat/pth-ultralytics.yolo.obb
    baseImage: ubuntu:24.04

    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive

        - kind: ENV
          value: PIP_BREAK_SYSTEM_PACKAGES=1

        - kind: RUN
          value: apt-get update && apt-get install -y python3 python3-pip python-is-python3 curl git libgl1 libglib2.0-0

        - kind: WORKDIR
          value: /opt/nuclio

        - kind: RUN
          value: python3 -m pip install --no-cache-dir ultralytics

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume